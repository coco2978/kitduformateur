<body>

<header class="site-header">
<a href="index.html" class="site-title">
    <h1>Annuaire des contacts</h1>
</a>
  <p>Recherche rapide des contacts utiles</p>
</header>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Rechercher..." onkeyup="searchTable()">
</div>

<table id="table">
<thead>
<tr>
<th>Catégorie</th>
<th>Adresse</th>
<th>CP</th>
<th>Ville</th>
<th>Tel</th>
<th>Courriel</th>
<th>Commentaire</th>
</tr>
</thead>

<tbody></tbody>
</table>

<script>
fetch("contacts.csv")
.then(r => r.text())
.then(data => {
let rows = data.split("\n").slice(1);
let tbody = document.querySelector("tbody");

rows.forEach(row => {
if(row.trim() === "") return;

let cols = row.split(",");
let tr = document.createElement("tr");

cols.forEach(c => {
let td = document.createElement("td");
td.textContent = c;
tr.appendChild(td);
});

tbody.appendChild(tr);
});
});

function searchTable(){
let input = document.getElementById("searchInput").value.toLowerCase();
let rows = document.querySelectorAll("tbody tr");

rows.forEach(r => {
r.style.display = r.textContent.toLowerCase().includes(input) ? "" : "none";
});
}
</script>
