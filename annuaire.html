<body>

<header class="site-header">
<a href="index.html" class="site-title">
<h1>Annuaire des contacts</h1>
</a>
<p>Recherche rapide des contacts utiles</p>
</header>

<main>

<table class="annuaire-table">

<thead>

<tr>
<th>Catégorie<br><input type="text" onkeyup="filterTable(0)" placeholder="Filtrer"></th>
<th>Adresse<br><input type="text" onkeyup="filterTable(1)" placeholder="Filtrer"></th>
<th>CP<br><input type="text" onkeyup="filterTable(2)" placeholder="Filtrer"></th>
<th>Ville<br><input type="text" onkeyup="filterTable(3)" placeholder="Filtrer"></th>
<th>Téléphone<br><input type="text" onkeyup="filterTable(4)" placeholder="Filtrer"></th>
<th>Email<br><input type="text" onkeyup="filterTable(5)" placeholder="Filtrer"></th>
<th>Commentaire<br><input type="text" onkeyup="filterTable(6)" placeholder="Filtrer"></th>
</tr>

</thead>

<tbody>
</tbody>

</table>

</main>

<footer>
<p>© 2026 - Portail ressources formateurs |
<a href="mentions.html">Mentions légales</a></p>
</footer>

<script>

fetch("contacts.csv")
.then(response => response.text())
.then(data => {

let rows = data.split("\n").slice(1);
let tbody = document.querySelector("tbody");

rows.forEach(row => {

if(row.trim() === "") return;

let cols = row.split(",");
let tr = document.createElement("tr");

cols.forEach(col => {

let td = document.createElement("td");
td.textContent = col;
tr.appendChild(td);

});

tbody.appendChild(tr);

});

});

function filterTable(col){

let input = document.querySelectorAll("thead input")[col];
let filter = input.value.toLowerCase();
let rows = document.querySelectorAll("tbody tr");

rows.forEach(row => {

let cell = row.children[col];

if(cell.textContent.toLowerCase().includes(filter)){
row.style.display = "";
}else{
row.style.display = "none";
}

});

}

</script>

</body>
</html>
